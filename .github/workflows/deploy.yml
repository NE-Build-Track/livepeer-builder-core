name: Deploy

on:
  push:
    branches:
      - "**"
  workflow_dispatch:
    inputs:
      service:
        description: Service to deploy
        type: choice
        options:
          - all
          - batteries
          - signer
          - engine
        default: all

permissions:
  contents: read

jobs:
  target:
    name: Choose environment
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.set.outputs.name }}
    steps:
      - name: Select preview or production
        id: set
        run: |
          case "$GITHUB_REF" in
            refs/heads/main|refs/heads/releases/*)
              echo "name=production" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "name=preview" >> "$GITHUB_OUTPUT"
              ;;
          esac

  services:
    name: Choose services
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.set.outputs.list }}
    steps:
      - name: Select services
        id: set
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REQUESTED: ${{ inputs.service }}
        run: |
          case "$REQUESTED" in
            batteries|signer|engine) chosen="[\"$REQUESTED\"]" ;;
            *) chosen='["batteries","signer","engine"]' ;;
          esac
          # Branch pushes update the engine only, so a preview branch does not
          # restart the shared Batteries and signer. Production pushes, and a
          # manual run, deploy the selected services.
          if [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            case "$REF" in
              refs/heads/main|refs/heads/releases/*) chosen='["batteries","signer","engine"]' ;;
              *) chosen='["engine"]' ;;
            esac
          fi
          echo "list=$chosen" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy ${{ matrix.service }} (${{ needs.target.outputs.name }})
    needs: [target, services]
    runs-on: ubuntu-latest
    environment: ${{ needs.target.outputs.name }}
    concurrency:
      group: deploy-${{ matrix.service }}-${{ github.ref }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.services.outputs.list) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy ${{ matrix.service }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          SERVICE: ${{ matrix.service }}
          SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          TARGET: ${{ needs.target.outputs.name }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "RAILWAY_TOKEN is not set on the ${TARGET} GitHub environment." >&2
            exit 1
          fi
          message="${TARGET} ${REF_NAME} ${SERVICE} ${SHA}"
          case "$SERVICE" in
            engine)
              # No path argument. `railway up .` treats "." as a subdirectory
              # prefix and exits with "prefix not found" before uploading.
              railway up \
                --service engine \
                --ci \
                -m "$message"
              ;;
            batteries|signer)
              railway up "deploy/railway/${SERVICE}" \
                --path-as-root \
                --service "$SERVICE" \
                --ci \
                -m "$message"
              ;;
            *)
              echo "unknown service ${SERVICE}" >&2
              exit 1
              ;;
          esac
