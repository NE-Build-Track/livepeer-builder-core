# livepeer-builder dev stack. Optional; not part of CI. See README.md.
#
# Batteries (embedded Kafka) + livepeer/node remote signer + the engine. Orchestrators are assumed to
# exist on the network: the engine discovers the ones listed in config/orchestrators.json, and the signer
# pays them (D42). TLS is verified with the system trust store; nothing here installs extra certificates.
# Upstream sources are pinned to the M2 baseline commits (docs/references/upstream-baseline.md).
name: livepeer-builder-dev

services:
  clearinghouse:
    image: ${IMAGE_REGISTRY:+${IMAGE_REGISTRY}/}livepeer-builder-dev/clearinghouse:ca09e47
    build:
      context: https://github.com/NE-Build-Track/clearinghouse-batteries.git#ca09e47c067682fb48c3f15425546fb6aa5b6659
      dockerfile: examples/compose/Dockerfile
    command: [serve, --config-file, /etc/clearinghouse.toml]
    volumes:
      - paid-state:/data
      - ./config/clearinghouse.toml:/etc/clearinghouse.toml:ro
      - ./secrets:/run/secrets:ro
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:8081/readyz]
      interval: 5s
      retries: 12

  signer:
    image: ${IMAGE_REGISTRY:+${IMAGE_REGISTRY}/}livepeer-builder-dev/node:406b248
    build:
      context: https://github.com/NE-Build-Track/node.git#406b248f6cb8728e6e7eba1809901f589060bc6b
      dockerfile: docker/Dockerfile
    user: "0:0"  # dev only: lets the container read bind-mounted secrets regardless of host uid
    network_mode: service:clearinghouse  # Kafka and the webhook listen on this namespace's loopback
    entrypoint: ["/usr/local/bin/livepeer-signer"]
    command: [--data-dir, /data/node, --config, /etc/signer.toml]
    volumes:
      - paid-state:/data
      - ./config/signer.toml:/etc/signer.toml:ro
      - ./secrets:/run/secrets:ro
    depends_on:
      clearinghouse:
        condition: service_healthy

  engine:
    build:
      context: ../..
      dockerfile: deploy/dev-stack/engine/Dockerfile
    image: ${IMAGE_REGISTRY:+${IMAGE_REGISTRY}/}livepeer-builder-dev/engine:local
    env_file: [.env]
    environment:
      LPB_ORCHESTRATOR_LIST: /etc/livepeer-builder/orchestrators.json
    ports: ["127.0.0.1:8080:8080"]
    volumes:
      - engine-data:/data
      - ./config/orchestrators.json:/etc/livepeer-builder/orchestrators.json:ro
    depends_on: [signer]

volumes:
  engine-data:
  paid-state:
