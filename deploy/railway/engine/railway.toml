[build]
builder = "DOCKERFILE"
dockerfilePath = "deploy/railway/engine/Dockerfile"

[deploy]
# Railway passes this as the argument to the image ENTRYPOINT. It runs in a
# separate container before the new process starts. Volumes are not mounted
# there; this command only talks to Postgres. A failure cancels the deploy.
preDeployCommand = "python3 -u /usr/local/bin/entrypoint.py migrate"
preDeployTimeoutSeconds = 120
healthcheckPath = "/livez"
healthcheckTimeout = 300
restartPolicyType = "ALWAYS"
restartPolicyMaxRetries = 10
