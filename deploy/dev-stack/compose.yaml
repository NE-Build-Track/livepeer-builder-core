# livepeer-builder dev stack. Optional; not part of CI. See README.md.
#
# Batteries (embedded Kafka) + livepeer/node remote signer + the discovery service + the engine.
# Orchestrators are assumed to exist on the network: the discovery service lists the ones in
# config/orchestrators.txt (docs/contracts/discovery.md), and the signer only signs payments.
# Upstream sources are pinned to the M2 baseline commits (docs/references/upstream-baseline.md).
name: livepeer-builder-dev

services:
  clearinghouse:
    image: ${IMAGE_REGISTRY:+${IMAGE_REGISTRY}/}livepeer-builder-dev/clearinghouse:ca09e47
    build:
      context: https://github.com/livepeer/clearinghouse-batteries.git#ca09e47c067682fb48c3f15425546fb6aa5b6659
      dockerfile: examples/compose/Dockerfile
    command: [serve, --config-file, /etc/clearinghouse.toml]
    volumes:
      - paid-state:/data
      - ./config/clearinghouse.toml:/etc/clearinghouse.toml:ro
      - ./secrets:/run/secrets:ro
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:8081/readyz]
      interval: 5s
      retries: 12

  signer:
    image: ${IMAGE_REGISTRY:+${IMAGE_REGISTRY}/}livepeer-builder-dev/node:406b248
    build:
      context: https://github.com/livepeer/node.git#406b248f6cb8728e6e7eba1809901f589060bc6b
      dockerfile: docker/Dockerfile
    user: "0:0"  # dev only: lets the container read bind-mounted secrets regardless of host uid
    network_mode: service:clearinghouse  # Kafka and the webhook listen on this namespace's loopback
    entrypoint: ["/usr/local/bin/livepeer-signer"]
    command: [--data-dir, /data/node, --config, /etc/signer.toml]
    volumes:
      - paid-state:/data
      - ./config/signer.toml:/etc/signer.toml:ro
      - ./secrets:/run/secrets:ro
    depends_on:
      clearinghouse:
        condition: service_healthy

  discovery:  # livepeer-onchain-discovery; the same image contract as Railway
    image: ${IMAGE_REGISTRY:+${IMAGE_REGISTRY}/}livepeer-builder-dev/discovery:local
    build:
      context: ../..
      dockerfile: deploy/railway/discovery/Dockerfile
    user: "0:0"  # dev only: secrets/rpc-url is mode 0600, and the image user cannot read it
    environment:
      LIVEPEER_ONCHAIN_DISCOVERY_LISTEN: 0.0.0.0:8939
      LIVEPEER_ONCHAIN_DISCOVERY_NODES: /etc/lpd/orchestrators.txt
      LIVEPEER_ONCHAIN_DISCOVERY_RPC_URL_FILE: /run/secrets/rpc-url
    volumes:
      - ./config/orchestrators.txt:/etc/lpd/orchestrators.txt:ro
      - ./secrets/rpc-url:/run/secrets/rpc-url:ro
    ports: ["127.0.0.1:8939:8939"]

  engine:
    build:
      context: ../..
      dockerfile: deploy/dev-stack/engine/Dockerfile
    image: ${IMAGE_REGISTRY:+${IMAGE_REGISTRY}/}livepeer-builder-dev/engine:local
    env_file: [.env]
    environment:
      LPB_DISCOVERY_URL: http://discovery:8939/discovery
    ports: ["127.0.0.1:8080:8080"]
    volumes: [engine-data:/data]
    depends_on: [signer]

volumes:
  engine-data:
  paid-state:
