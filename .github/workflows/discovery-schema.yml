# D63: compare the vendored discovery schema with livepeer/node. Never on pull requests.
name: discovery schema

on:
  schedule:
    - cron: "17 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare the pin with livepeer/node
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python3 scripts/check_discovery_schema.py > "$RUNNER_TEMP/schema.txt"
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 2 ]; then
            echo "drifted=true" >> "$GITHUB_OUTPUT"
          elif [ "$code" -ne 0 ]; then
            exit "$code"
          fi
      - name: Open an issue when the schema moved
        if: steps.compare.outputs.drifted == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "discovery schema drift" --json number --jq 'length')
          if [ "$existing" != "0" ]; then
            exit 0
          fi
          gh issue create --repo "$GITHUB_REPOSITORY" --title "discovery schema drift" --body "$(cat <<EOF
          The vendored \`GET /discovery\` schema no longer matches livepeer/node.

          \`\`\`
          $(cat "$RUNNER_TEMP/schema.txt")
          \`\`\`

          D63: bump the pin in a pull request. This check does not run on pull requests.
          EOF
          )"
