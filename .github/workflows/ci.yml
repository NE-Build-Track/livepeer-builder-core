# ISS-07: development builds and continuous checks. Builds are CI artifacts only; nothing is published.
name: ci

on:
  push:
    branches: [main, "releases/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_PYTHON: "3.12"

jobs:
  checks:
    name: lint, types, docs, tests (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # hatch-vcs derives the dev version from git history
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run python scripts/check_docs.py
      - run: uv run lpb gen-docs --check
      - name: Tests with branch coverage
        run: uv run pytest -q --cov --cov-report=xml --cov-report=json --cov-report=term
      - name: Per-layer coverage floors
        run: uv run python scripts/check_coverage.py >> "$GITHUB_STEP_SUMMARY"
      - name: Diff coverage (changed lines)
        if: github.event_name == 'pull_request'
        run: uv run diff-cover coverage.xml --compare-branch=origin/${{ github.base_ref }} --fail-under=90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml
          retention-days: 14

  postgres:
    name: store suite (PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lpb
          POSTGRES_PASSWORD: lpb
          POSTGRES_DB: lpb
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lpb" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      LPB_TEST_POSTGRES_URL: postgresql+asyncpg://lpb:lpb@127.0.0.1:5432/lpb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras --frozen
      - run: uv run pytest tests/store -q -m "postgres or not postgres"

  container:
    name: engine image + container smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # hatch-vcs reads the version from .git inside the image
          persist-credentials: false  # .git is copied into the build; keep the token out of it
      - name: Build the engine image (deploy/dev-stack/engine/Dockerfile)
        run: docker build -f deploy/dev-stack/engine/Dockerfile -t livepeer-builder-engine:ci .
      - name: Runs as a non-root user
        run: test "$(docker run --rm --entrypoint id livepeer-builder-engine:ci -u)" != "0"
      - name: lpb smoke inside the image
        run: docker run --rm livepeer-builder-engine:ci lpb smoke
      - name: The served engine is ready and refuses unauthenticated jobs
        run: |
          docker run -d --name engine -e LPB_DISCOVERY_URL=http://127.0.0.1:9/discovery -p 127.0.0.1:8080:8080 livepeer-builder-engine:ci
          for _ in $(seq 30); do curl -fsS -o /dev/null http://127.0.0.1:8080/readyz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/readyz
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8080/v1/jobs \
            -H 'Content-Type: application/json' -d '{"app":"smoke"}')
          test "$status" = "401"
      - name: Engine logs
        if: failure()
        run: docker logs engine || true

  build-install:
    name: dev build + clean-install smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - name: Build versioned dev packages
        run: uv build
      - name: Wheel ships its migrations
        run: uv run --frozen --all-extras pytest tests/store/test_packaging.py -q
      - name: Install the wheel into a clean environment and run the smoke check
        run: |
          uv venv /tmp/clean
          uv pip install --python /tmp/clean/bin/python dist/*.whl
          mkdir -p /tmp/smoke && cd /tmp/smoke
          /tmp/clean/bin/lpb smoke
          LPB_DATABASE_URL=sqlite+aiosqlite:///./smoke.db /tmp/clean/bin/lpb migrate
          LPB_DATABASE_URL=sqlite+aiosqlite:///./smoke.db /tmp/clean/bin/lpb revision
      - uses: actions/upload-artifact@v4
        with:
          name: livepeer-builder-dist
          path: dist/
          retention-days: 14

  sonarqube:
    name: SonarQube Quality Gate
    # GitHub does not provide analysis credentials to external fork PRs.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras --frozen
      - name: Generate Python coverage for SonarQube
        run: uv run --frozen pytest -q --cov --cov-report=xml
      - name: Restore SonarQube scanner cache
        id: sonar-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: sonarqube-${{ runner.os }}-${{ runner.arch }}-26.5-${{ hashFiles('sonar-project.properties') }}
      - name: Set up scanner Java runtime
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Scan and check the SonarQube quality gate
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_COMMUNITY_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        with:
          args: >-
            -Dsonar.scanner.skipJreProvisioning=true
            -Dsonar.scanner.javaExePath=${{ env.JAVA_HOME }}/bin/java
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=600
            -Dsonar.scm.revision=${{ github.event.pull_request.head.sha || github.sha }}
      - name: Save SonarQube scanner cache
        if: always() && steps.sonar-cache.outcome == 'success' && steps.sonar-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ steps.sonar-cache.outputs.cache-primary-key }}
